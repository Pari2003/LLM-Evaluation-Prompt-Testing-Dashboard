[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation-dashboard"
version = "1.0.0"
description = "FastAPI-based LLM evaluation platform for benchmarking responses on latency, token efficiency, and hallucination behavior across controlled experiments"
authors = [{name = "Maitraiyee Bhatt", email = "maitraiyeebhatt@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "numpy>=2.0.0",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
